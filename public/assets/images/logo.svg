<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="cyber-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="border-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Obsidian Base Squircle -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="#090d16" stroke="url(#border-gradient)" stroke-width="8" />

  <!-- Subtle Blueprint Tech Grid in Background -->
  <path d="M120 16 v480 M256 16 v480 M392 16 v480 M16 120 h480 M16 256 h480 M16 392 h480" stroke="#162238" stroke-width="2" stroke-dasharray="6 6" />

  <!-- Corner Radar Crosses -->
  <path d="M 48 40 v 16 M 40 48 h 16" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" />
  <path d="M 464 40 v 16 M 456 48 h 16" stroke="#34d399" stroke-width="3" stroke-linecap="round" />
  <path d="M 48 464 v -16 M 40 464 h 16" stroke="#34d399" stroke-width="3" stroke-linecap="round" />
  <path d="M 464 464 v -16 M 456 464 h 16" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" />

  <!-- Monogram RS in Architectural Precision Geometry -->
  <g filter="url(#neon-glow)">
    <!-- Letter R -->
    <path d="M 125 140 h 85 a 55 55 0 0 1 55 55 v 0 a 55 55 0 0 1 -55 55 h -45 v 122 h -40 Z" fill="url(#cyber-gradient)" />
    <!-- R Counter (Cutout) -->
    <path d="M 165 178 h 45 a 17 17 0 0 1 17 17 v 0 a 17 17 0 0 1 -17 17 h -45 Z" fill="#090d16" />
    <!-- R Leg -->
    <path d="M 185 245 l 65 137 h 48 l -70 -137 Z" fill="url(#cyber-gradient)" />

    <!-- Letter S -->
    <path d="M 390 188 c -8 -28 -32 -48 -66 -48 c -44 0 -72 26 -72 60 c 0 38 30 52 64 63 c 35 11 50 20 50 38 c 0 20 -18 33 -44 33 c -32 0 -54 -18 -58 -44 h -38 c 4 45 42 78 96 78 c 48 0 84 -28 84 -68 c 0 -42 -33 -56 -68 -66 c -34 -10 -46 -19 -46 -35 c 0 -17 15 -27 36 -27 c 24 0 42 12 48 32 Z" fill="#ffffff" />
  </g>

  <!-- Status Neon Dot -->
  <circle cx="256" cy="428" r="7" fill="#34d399" />
</svg>
